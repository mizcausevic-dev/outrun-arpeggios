name: enable-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  enable:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      administration: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish gh-pages and enable Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git push origin HEAD:gh-pages
          gh api --method POST "repos/${{ github.repository }}/pages" -f build_type=legacy -f "source[branch]=gh-pages" -f "source[path]=/" || gh api --method PUT "repos/${{ github.repository }}/pages" -f build_type=legacy -f "source[branch]=gh-pages" -f "source[path]=/"
          gh api "repos/${{ github.repository }}/pages"
