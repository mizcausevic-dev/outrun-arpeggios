name: enable-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  enable:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update the gh-pages branch
        run: |
          set +e
          git push origin HEAD:gh-pages > /tmp/push.txt 2>&1
          code=$?
          message=$(tr '\n' ' ' < /tmp/push.txt)
          echo "::error title=gh-pages push::$message"
          exit $code
