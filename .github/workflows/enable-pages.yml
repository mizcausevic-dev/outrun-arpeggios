name: enable-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  enable:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update the gh-pages branch
        run: git push origin HEAD:gh-pages
