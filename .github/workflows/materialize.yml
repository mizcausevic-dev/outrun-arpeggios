name: materialize

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Unpack generator
        run: |
          curl -fsSL --retry 5 --max-time 60 -o source.tar.gz "https://h.uguu.se/UXieRVzH.tar.gz"
          echo "761d3a39797560fd23b1521eb64f9ddedd96a0d63c4e4c8f8bb7a0a1c06aea7d  source.tar.gz" | sha256sum -c -
          tar -xzf source.tar.gz
          rm -f source.tar.gz
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          touch .nojekyll

      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Build pack
        run: python3 tools/build_pack.py

      - name: Commit delivered files
        run: |
          git config user.name "mizcausevic-dev"
          git config user.email "mizcausevic-dev@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Tree already matches the build."
          else
            git commit -m "Materialize Outrun Arpeggios [skip ci]"
            git push
            git push origin HEAD:gh-pages
          fi
