name: materialize

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack generator
        run: |
          curl -fsSL --retry 5 --max-time 60 -o source.tar.gz "https://n.uguu.se/louQbhmp.tar.gz"
          echo "ab8ee05c9a2637f6f817294997abbe2304ff04d7bbe2e51082b655837451598d  source.tar.gz" | sha256sum -c -
          tar -xzf source.tar.gz
          rm -f source.tar.gz
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          touch .nojekyll

      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Build pack
        run: python3 tools/build_pack.py

      - name: Commit delivered files
        run: |
          git config user.name "mizcausevic-dev"
          git config user.email "mizcausevic-dev@users.noreply.github.com"
          git pull --rebase origin main
          git add -A
          if git diff --cached --quiet; then
            echo "Tree already matches the build."
          else
            git commit -m "Materialize Outrun Arpeggios [skip ci]"
          fi
          git fetch origin gh-pages
          if ! git merge-base --is-ancestor origin/gh-pages HEAD; then
            git merge origin/gh-pages -m "Merge gh-pages [skip ci]"
          fi
          git push origin HEAD:main
          git push origin HEAD:gh-pages
