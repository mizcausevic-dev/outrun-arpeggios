name: materialize

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4

      - name: Unpack generator
        run: |
          curl -fsSL --retry 5 --max-time 60 -o source.tar.gz "https://h.uguu.se/UXieRVzH.tar.gz"
          echo "761d3a39797560fd23b1521eb64f9ddedd96a0d63c4e4c8f8bb7a0a1c06aea7d  source.tar.gz" | sha256sum -c -
          tar -xzf source.tar.gz
          rm -f source.tar.gz
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          touch .nojekyll

      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Build pack
        run: python3 tools/build_pack.py

      - name: Commit delivered files
        run: |
          git config user.name "mizcausevic-dev"
          git config user.email "mizcausevic-dev@users.noreply.github.com"
          git add -A
          git commit -m "Materialize Outrun Arpeggios [skip ci]"
          git push
          git push origin HEAD:gh-pages

      - name: Publish GitHub Pages from gh-pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3 4 5; do
            gh api --method POST "repos/${{ github.repository }}/pages" \
              -f build_type=legacy \
              -f "source[branch]=gh-pages" \
              -f "source[path]=/" \
            && break
            gh api --method PUT "repos/${{ github.repository }}/pages" \
              -f build_type=legacy \
              -f "source[branch]=gh-pages" \
              -f "source[path]=/" \
            && break
            sleep 8
          done
          gh api --method PUT "repos/${{ github.repository }}/topics" --input - <<'EOF' || true
          {"names":["midi","synthwave","arpeggio","music-production","composition"]}
          EOF
